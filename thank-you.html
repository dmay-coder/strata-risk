<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message Received | Strata Risk</title>
  <link rel="icon" type="image/png" href="assets/icon-light.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #1a1a1a;
      color: #f8f7f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      padding: 2rem;
      text-align: center;
    }

    .thank-you-logo {
      height: 40px;
      width: auto;
      margin-bottom: 3rem;
      opacity: 0;
      animation: fadeIn 0.6s ease forwards;
    }

    .thank-you-title {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      margin-bottom: 1rem;
      opacity: 0;
      animation: fadeIn 0.6s ease 0.15s forwards;
    }

    .thank-you-body {
      font-size: 1rem;
      color: rgba(248, 247, 245, 0.5);
      line-height: 1.75;
      max-width: 440px;
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: fadeIn 0.6s ease 0.3s forwards;
    }

    .thank-you-link {
      display: inline-block;
      font-size: 0.75rem;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: #c83c3c;
      text-decoration: none;
      padding: 0.9rem 2rem;
      border: 1px solid rgba(200, 60, 60, 0.4);
      border-radius: 4px;
      transition: background 0.25s, border-color 0.25s;
      opacity: 0;
      animation: fadeIn 0.6s ease 0.45s forwards;
    }

    .thank-you-link:hover {
      background: rgba(200, 60, 60, 0.1);
      border-color: #c83c3c;
    }

    .accent-line {
      width: 40px;
      height: 3px;
      background: #c83c3c;
      margin-bottom: 2rem;
      opacity: 0;
      animation: fadeIn 0.6s ease 0.1s forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <img class="thank-you-logo" src="assets/logo-light.png" alt="Strata Risk">
  <div class="accent-line"></div>
  <h1 class="thank-you-title">Message received.</h1>
  <p class="thank-you-body">We've received your inquiry and will be in touch shortly. If your request is time-sensitive, reach out directly at <a href="mailto:dmay@strata-risk.com" style="color: #c83c3c; text-decoration: none;">dmay@strata-risk.com</a></p>
  <a href="/" class="thank-you-link">Back to Strata Risk</a>
</body>
</html>
